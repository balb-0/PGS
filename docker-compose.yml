# Docker Compose - Stack Prometheus para API ASIS TaxTech
# Ref: docs/plano_integracao_prometheus.md (T11)
#
# Uso: docker-compose up -d
# Prometheus: http://localhost:9090/targets
# Se falhar, use: docker-compose run --rm -p 9090:9090 prometheus
#   com volume: -v ${PWD}/prometheus.docker.standalone.yml:/etc/prometheus/prometheus.yml

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: asis-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.docker.standalone.yml:/etc/prometheus/prometheus.yml
      - ./rules.yml:/etc/prometheus/rules.yml
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    extra_hosts:
      - "host.docker.internal:host-gateway"

  alertmanager:
    image: prom/alertmanager:latest
    container_name: asis-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
