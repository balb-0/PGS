# Docker Compose - Stack Prometheus + Grafana para API ASIS TaxTech
# Ref: docs/plano_integracao_prometheus.md (T11, T13)
#
# Uso:
#   docker-compose up -d
#
# Endpoints:
#   Prometheus:  http://localhost:9090/targets
#   Alertmanager: http://localhost:9093
#   Grafana:     http://localhost:3000  (admin / admin)

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: asis-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.docker.standalone.yml:/etc/prometheus/prometheus.yml
      - ./rules.yml:/etc/prometheus/rules.yml
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    extra_hosts:
      - "host.docker.internal:host-gateway"

  alertmanager:
    image: prom/alertmanager:latest
    container_name: asis-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml

  grafana:
    image: grafana/grafana:latest
    container_name: asis-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
