stages:
  - test
  - quality

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"
  GIT_DEPTH: "0"

cache:
  paths:
    - .cache/pip
    - .sonar/cache

pytest:
  stage: test
  image: python:3.12
  allow_failure: true
  script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - pytest --cov=src/core --cov-report=xml:coverage.xml --junitxml=pytest-report.xml
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - coverage.xml
      - pytest-report.xml
    reports:
      junit: pytest-report.xml

sonarcloud:
  stage: quality
  when: always
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  needs:
    - job: pytest
      artifacts: true
  script:
    - sonar-scanner -Dsonar.host.url="${SONAR_HOST_URL:-https://sonarcloud.io}" -Dsonar.token="$SONAR_TOKEN"
  only:
    - branches
    - merge_requests
