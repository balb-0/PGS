# Prometheus - Configuração standalone (sem Alertmanager)
# Use este arquivo se o docker-compose falhar por causa do Alertmanager

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

# Sem alerting - Prometheus inicia mesmo se Alertmanager não estiver disponível
# Para ativar: descomente e suba o Alertmanager
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: asis_api
    static_configs:
      - targets: ['host.docker.internal:8000']
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: asis_pytest
    static_configs:
      - targets: ['host.docker.internal:9092']
    metrics_path: /metrics
    scrape_interval: 60s
