[pytest]
testpaths = src/tests
python_files = test_*.py *_test.py *_blue.py *_red.py
markers =
	security: cenarios de seguranca e autenticidade
	critical: cenarios criticos de negocio e risco
	happy_path: fluxo feliz de autorizacao
	edge_case: fluxo de borda com resiliencia
	failure_case: fluxo de falha/ataque
