# Alertmanager - Configuração para API ASIS TaxTech
# Ref: docs/plano_integracao_prometheus.md (seção 4)

global:
  # resolve_timeout: 5m  # tempo para marcar alerta como resolvido

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 5m
  receiver: default
  routes:
    # Alertas críticos (DN1, DN3, DN4)
    - match:
        severity: critical
      receiver: critical
      continue: true
    # Alertas warning
    - match:
        severity: warning
      receiver: warning

receivers:
  - name: default
    # Receiver padrão - sem notificação (apenas agrupa no Alertmanager)
    # Para ativar notificações, adicione webhook_configs, slack_configs ou email_configs

  - name: critical
    # Alertas críticos: SLAViolation, CircuitBreakerOpen, AuditChainAlert
    # Exemplo webhook: webhook_configs: [{ url: 'http://localhost:5001/webhook' }]
    # Exemplo Slack: slack_configs: [{ channel: '#alertas', api_url: 'https://hooks.slack.com/...' }]

  - name: warning
    # Alertas warning: HighLatency, HighErrorRate, RateLimitLow
    # Exemplo email: email_configs: [{ to: 'equipe@exemplo.com', ... }]
