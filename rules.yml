# Regras de alerta - API ASIS TaxTech
# Ref: docs/plano_integracao_prometheus.md (seção 3.4)

groups:
  - name: asis_dn1_latency
    rules:
      - alert: HighLatency
        expr: histogram_quantile(0.9, sum(rate(asis_request_duration_seconds_bucket[5m])) by (le)) > 0.65
        for: 2m
        labels:
          severity: warning
          dn: DN1
        annotations:
          summary: "Latência P90 acima de 650ms (DN1)"

      - alert: SLAViolation
        expr: histogram_quantile(0.9, sum(rate(asis_request_duration_seconds_bucket[5m])) by (le)) > 0.5
        for: 2m
        labels:
          severity: critical
          dn: DN1
        annotations:
          summary: "Violação de SLA - Latência P90 acima de 500ms (DN1)"

  - name: asis_dn3_availability
    rules:
      - alert: HighErrorRate
        expr: asis_health_error_rate_percent > 30
        for: 2m
        labels:
          severity: warning
          dn: DN3
        annotations:
          summary: "Taxa de erro acima de 30% (DN3)"

      - alert: CircuitBreakerOpen
        expr: asis_circuit_breaker_state{state="OPEN"} == 1
        for: 1m
        labels:
          severity: critical
          dn: DN3
        annotations:
          summary: "Circuit breaker aberto (DN3)"

      - alert: RateLimitLow
        expr: asis_rate_limit_remaining < 3
        for: 2m
        labels:
          severity: warning
          dn: DN3
        annotations:
          summary: "Rate limit restante baixo (DN3)"

  - name: asis_dn4_non_repudiation
    rules:
      - alert: AuditChainAlert
        expr: increase(asis_nr_alerts_total{alert_type="chain"}[5m]) > 0
        for: 1m
        labels:
          severity: critical
          dn: DN4
        annotations:
          summary: "Alerta de cadeia de auditoria comprometida (DN4)"
